apply plugin: 'com.android.application'

// La cantidad de commits del repositorio. Si git no esta -una copia sin historia- vale 1 y la
// construccion sigue: el numero nunca hace fallar el APK.
//
// -15-10-2026- SIGO_VERSION_CODE, SI VIENE, MANDA. Juntar ramas con squash BAJA la cuenta: el Redmi
// tenia instalada la 678, el APK siguiente de main salio 676 y Android lo rechazo como «paquete no
// valido» -no instala un numero menor encima-; habia que desinstalar o inventar commits vacios.
// scripts/apk.mjs -solo el APK de prueba- lo pone en lo instalado en el telefono + 1 cuando la cuenta
// queda corta. La version para Play -scripts/play.mjs- no lo pone: sigue siendo la cuenta de commits.
// Antes: la funcion empezaba directo en el try de abajo.
def numeroDeVersion() {
    def forzado = System.getenv('SIGO_VERSION_CODE')
    if (forzado != null && forzado.trim().isInteger()) return forzado.trim().toInteger()
    try {
        def p = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir.parentFile)
        def salida = p.text.trim()
        p.waitFor()
        return p.exitValue() == 0 ? salida.toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}

// LA LLAVE DE SUBIDA A GOOGLE PLAY -tarea 84, A1, 29-09-2026-.
//
// NINGUNA CONTRASEÑA NI LLAVE ENTRA AL REPOSITORIO. La llave la crea Javier en su computador y
// sus datos van en android/keystore.properties -storeFile, storePassword, keyAlias, keyPassword-,
// que .gitignore deja fuera. El molde sin datos es android/keystore.properties.ejemplo.
//
// Si el archivo no está, la construcción de release igual funciona, sin firmar, y lo avisa: así el
// repositorio compila en cualquier máquina -la de un probador, la del bot-. La APK de prueba
// -assembleDebug, npm run apk- no mira nada de esto: sigue firmada con la llave de depuración.
def archivoLlaveSubida = rootProject.file('keystore.properties')
def llaveSubida = new Properties()
if (archivoLlaveSubida.exists()) {
    archivoLlaveSubida.withInputStream { llaveSubida.load(it) }
}
def hayLlaveSubida = archivoLlaveSubida.exists()

// -tarea 104- Desde la tarea 104 son tres paquetes, los tres a pedido: model-es, model-en y gestos.
// LA VERSIÓN DE PLAY VA POR OTRO CAMINO -tarea 84-. npm run play -scripts/play.mjs- construye con
// -PparaPlay: solo entonces los modelos de voz salen del paquete base y viajan en sus paquetes de
// recursos -model-es, model-en, parte D-. Sin la propiedad -npm run apk, la APK de prueba- todo
// queda exactamente como antes: los dos modelos dentro, en assets.
def paraPlay = project.hasProperty('paraPlay')

android {
    // EL IDENTIFICADOR DE LA APP -24-09-2026-. Era com.teleprompter.app, generico, y en Google Play
    // ya lo usa otra aplicacion: no se podia publicar con el. Es el unico dato que no se puede
    // cambiar nunca despues de subir la primera version. Va con el dominio sigoteleprompter.com,
    // que Javier inscribe. Cambiarlo hace que el telefono la trate como una app nueva.
    namespace = "com.sigoteleprompter.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sigoteleprompter.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // EL NUMERO DE VERSION SUBE SOLO -28-09-2026-. Era versionCode 1 fijo: todas las APK salian
        // "1.0 (1)", la traductora vio en App Tester el mismo numero que ya tenia instalado y no habia
        // forma de saber si la version nueva era la nueva. Play ademas rechaza una subida que no
        // aumente este numero. Ahora es la cantidad de commits de main: cada APK construida despues de
        // un commit lleva un numero mayor, sin que nadie tenga que acordarse de cambiarlo.
        versionCode numeroDeVersion()
        // EL NOMBRE VISIBLE -06-10-2026, Javier-: "1.0" no era realista para una version de prueba.
        // 0.9.x mientras dure la prueba interna y la cerrada; sube a mano en cada version que se
        // manda -0.9.1, 0.9.2...-. La 1.0 queda para la publicacion de verdad. El versionCode, en
        // cambio, sigue subiendo solo: lo ve solo la consola. Antes: versionName "1.0".
        // -15-10-2026- 0.9.1: Velocidad fija, la app con luz, espacios del usuario y pulido. Antes: versionName "0.9.0"
        // -18-10-2026- 0.9.2: gestos de vuelta en Play, Parar y visor en tomas largas, subtítulos sin corte, motor
        // sin detenciones ni retrocesos, 14 Mbps, menú del guion y Ayuda. Antes: versionName "0.9.1"
        // -20-10-2026- 0.10.0 y no 0.9.3, decisión de Javier: trae una función grande, la cuenta con Google y la
        // copia de seguridad de los guiones; además la portada a 22 por lado y el panel de Ajustes más
        // transparente. Antes: versionName "0.9.2"
        versionName "0.10.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // SOLO LOS PROCESADORES DE LOS TELEFONOS -24-09-2026-. Las bibliotecas nativas -Vosk,
        // la camara- venian para seis arquitecturas, y las x86 son solo de emuladores: 21 MB
        // del APK de 99 que ningun telefono usa. Quedan arm64-v8a -todos los telefonos de los
        // ultimos anos, el de Javier incluido- y armeabi-v7a, los de 32 bits mas viejos. Para
        // correr en el emulador del PC: ./gradlew assembleDebug -PconEmulador
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
            if (project.hasProperty('conEmulador')) abiFilters 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Solo se declara si hay llave: un signingConfig con storeFile vacío hace fallar la
        // construcción, y el encargo pide que sin el archivo igual compile.
        if (hayLlaveSubida) {
            subida {
                storeFile rootProject.file(llaveSubida['storeFile'])
                storePassword llaveSubida['storePassword']
                keyAlias llaveSubida['keyAlias']
                keyPassword llaveSubida['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hayLlaveSubida) {
                signingConfig signingConfigs.subida
            } else {
                logger.warn('AVISO -tarea 84-: no está android/keystore.properties. El paquete de release sale SIN FIRMAR y Google Play no lo acepta. Ver android/keystore.properties.ejemplo.')
            }
            // R8 -tarea 84, parte C, 29-09-2026-: encoge y ofusca el código y saca los recursos que
            // nadie usa. Las reglas de lo que no se puede tocar -lo que Capacitor y JNA buscan por
            // nombre- están en proguard-rules.pro, cada una con su por qué. Era minifyEnabled false.
            //
            // LA BANDERA PARA APAGARLO -C3-: si R8 rompe algo que solo se ve en el teléfono,
            // ./gradlew bundleRelease -PsinR8 -o npm run play -- sinR8- arma igual que antes, sin
            // encoger, mientras se encuentra la regla que falta. La APK de prueba es debug y R8 no
            // la toca nunca.
            def conR8 = !project.hasProperty('sinR8')
            // SIMBOLOS DE DEPURACION NATIVOS -15-10-2026-: Play advirtio en la subida del 07-10 que el AAB no
            // los traia -Vosk y las demas bibliotecas .so-. Con la tabla de simbolos, los cierres que vengan de
            // codigo nativo llegan a la consola con nombres de funcion y no solo direcciones. No cambia el
            // tamano de lo que se instala: Play los guarda aparte.
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            minifyEnabled conR8
            shrinkResources conR8
            // Era 'proguard-android.txt', que trae -dontoptimize: pensado para cuando R8 estaba
            // apagado. Con R8 encendido va la de optimizar, la que recomienda la documentación de
            // Android -y la única que sigue existiendo desde AGP 9-.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // LOS MODELOS DE VOZ EN SUS PAQUETES DE RECURSOS, SOLO PARA PLAY -tarea 84, parte D-.
    //
    // Hoy cada persona descarga los dos modelos -126 MB- aunque lea en un solo idioma. En el AAB de
    // Play van aparte: model-es instalado con la app -install-time, el mercado principal- y model-en
    // bajado la primera vez que se lee en inglés -on-demand-. Ver android/model-es/build.gradle.
    //
    // Para eso las carpetas model-es y model-en tienen que salir de los assets del paquete base:
    // '<dir>model-es' saca la carpeta de assets con ese nombre -la del modelo y la del uuid de
    // genUUID-. El patrón es el de siempre -el que ya estaba en aaptOptions- más esas dos. Sin
    // -PparaPlay no se toca nada: la APK de prueba sigue con los dos modelos dentro -D4-.
    //
    // -tarea 104, PASO 2, 06-10-2026- AHORA LOS TRES A PEDIDO. model-es pasó a on-demand -ya no viene
    // con la instalación; se pide en silencio al abrir la app- y gesture_recognizer.task sale del paquete
    // base a su propio paquete a pedido, ':gestos' -android/gestos-, que se baja la primera vez que
    // alguien enciende Control por gestos. '<file>gesture_recognizer.task' lo saca de los assets del
    // paquete base, igual que '<dir>model-es' saca la carpeta. La APK de prueba sigue trayendo todo.
    // Antes:
    //   assetPacks = [':model-es', ':model-en']
    //   ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>model-es:<dir>model-en'
    // -portugues-voz, 2026-10-22- Suma ':model-pt', el portugués a pedido, y '<dir>model-pt' para sacarlo del paquete base
    // como los otros dos. Antes:
    //   assetPacks = [':model-es', ':model-en', ':gestos']
    //   ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>model-es:<dir>model-en:<file>gesture_recognizer.task'
    if (paraPlay) {
        assetPacks = [':model-es', ':model-en', ':model-pt', ':gestos']
        androidResources {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>model-es:<dir>model-en:<dir>model-pt:<file>gesture_recognizer.task'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }

    // EL MODELO DE GESTOS SIN COMPRIMIR -tarea 88, 04-10-2026-. MediaPipe abre gesture_recognizer.task
    // directo desde los assets -BaseOptions.setModelAssetPath- y para eso el archivo tiene que ir sin
    // comprimir en el paquete. Va en las dos construcciones, la de prueba y la de Play.
    //
    // -tarea 104, PASO 2- Antes: androidResources { noCompress 'task' }
    // Se quita porque no servía para lo que decía. Con una ruta relativa MediaPipe NO abre el asset en
    // su lugar: lo lee entero con el AssetManager y lo copia a getCacheDir()/drishti_asset_cache/ cada
    // vez que crea el reconocedor -mediapipe v1.0.0, resource_util_android.cc:83-87 y
    // asset_manager_util.cc:156-180-, y el AssetManager lee igual un asset comprimido. En la versión de
    // Play el .task ya no va en el APK sino en el paquete a pedido ':gestos', que Play deja como archivo
    // común sin comprimir; GestosPlugin lo abre con su ruta absoluta y MediaPipe lo mapea sin copia.
    // En la APK de prueba sigue en assets, ahora comprimido, con la misma copia en caché de siempre.
}

// EL uuid DEL MODELO. ESTO NO ES OPCIONAL Y NO SE ADIVINA.
//
// StorageService.unpack copia el modelo desde los assets a la memoria interna del
// telefono la primera vez, y despues compara este uuid para saber si tiene que
// volver a copiarlo. Sin el archivo, o no copia nunca o copia en cada arranque.
//
// Esta sacado del ejemplo oficial de Vosk para Android -alphacep/vosk-android-demo,
// modulo models-, que es el unico lugar donde esta escrito. No aparece en la
// documentacion.
//
// Un uuid por modelo -27-09-2026, se suma el ingles, docs/ingles.txt D3-: cada carpeta de
// assets -model-es, model-en- lleva el suyo, y VoskNativoPlugin desempaqueta cada idioma en
// su propia carpeta.
//
// LA MARCA SALE DEL CONTENIDO DEL MODELO, NO AL AZAR -28-09-2026-. Era UUID.randomUUID() en cada
// construccion: cada APK nueva traia otra marca y el telefono volvia a copiar el modelo entero
// -decenas de MB- en la primera lectura despues de CADA actualizacion, no solo al instalar. Esa
// lectura partia tarde -3,3 s en el Redmi de la traductora con la 1.0 (439)-. Ahora la marca es
// la huella de los archivos del modelo: cambia solo si cambia el modelo, y se copia una vez.
tasks.register('genUUID') {
    // -portugues-voz, 2026-10-22- Suma model-pt: su uuid lo usan la APK de prueba y el paquete model_pt. Antes:
    //   def carpetas = ['model-es', 'model-en']
    def carpetas = ['model-es', 'model-en', 'model-pt']
    def ofiles = carpetas.collect { file("$buildDir/generated/assets/$it/uuid") }
    outputs.files(ofiles)
    outputs.upToDateWhen { false }
    doLast {
        carpetas.eachWithIndex { carpeta, i ->
            def raiz = file("src/main/assets/$carpeta")
            def huella = java.security.MessageDigest.getInstance('SHA-256')
            if (raiz.exists()) {
                def archivos = []
                raiz.eachFileRecurse(groovy.io.FileType.FILES) { archivos << it }
                archivos.sort { it.path }.each { a ->
                    huella.update(raiz.toPath().relativize(a.toPath()).toString().replace('\\', '/').getBytes('UTF-8'))
                    a.withInputStream { entrada ->
                        byte[] buf = new byte[1 << 16]
                        int n
                        while ((n = entrada.read(buf)) > 0) huella.update(buf, 0, n)
                    }
                }
            }
            def f = ofiles[i]
            mkdir f.parentFile
            f.text = huella.digest().encodeHex().toString()
        }
    }
}

preBuild.dependsOn(genUUID)

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // CameraX View for CamaraNativaPlugin
    implementation "androidx.camera:camera-view:1.6.2"

    // VOSK NATIVO. La biblioteca oficial, de los mismos autores de Vosk, Apache 2.0.
    //
    // Es lo que reemplaza a Vosk WASM en Android. La version web baja 34 MB por
    // internet CADA VEZ que se aprieta Leer -comprobado el 14 de septiembre de 2026
    // poniendo el telefono en modo avion: no arranca- y despues tarda en armar el
    // modelo adentro del navegador. Aca el modelo viaja en el APK y la biblioteca
    // es codigo compilado: no se baja nada y no se arma nada en tiempo de ejecucion.
    // -tarea 104- En la versión de Play el modelo ya no viaja en el APK: se baja de Play una vez, en
    // silencio, al abrir la app -PaqueteDeVoz-. En la APK de prueba, sí.
    // JNA -tarea 104, Javier 06-10-2026-: se deja 5.13.0. En arm64 el AAB ya midió libjnidispatch.so
    // alineado a 64 KB, así que no hace falta subirla por el requisito de páginas de 16 KB. Se vuelve a
    // mirar cuando se actualice Vosk: vosk-android 0.3.75 pide 5.18.1, pero el @aar se salta esa
    // dependencia transitiva.
    // -15-10-2026- Se sube a 5.18.1, la que pide vosk-android 0.3.75. Play avisó al subir la 0.9.1: «Es
    // posible que tu app falle en dispositivos de 16 KB… base/lib/arm64-v8a/libjnidispatch.so», compilada
    // con un NDK anterior a r28. La alineación estaba bien; lo que faltaba son dos arreglos del registro
    // de cambios de JNA: «Fix calls to jnidispatch on Android with 16KB page size», en 5.16.0 y 5.17.0.
    // Sin ellos, en un teléfono de páginas de 16 KB las llamadas a Vosk pueden fallar. No 5.19.0: sube
    // el mínimo de Android a 8.0 -issue 1730 de JNA-; a Sigo no le afecta -minSdk 29- pero no hace falta.
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    // Antes: implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // SUBTITULOS QUEMADOS AL GUARDAR -24-09-2026-. Media3 Transformer, de Google:
    // vuelve a codificar la toma con el codificador de hardware y dibuja el
    // subtitulo en cada cuadro -CapaDeSubtitulos.java-. La 1.9.0 es la que la
    // camara ya trae -media3-common, -container y -muxer-: una sola version.
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
    implementation 'androidx.media3:media3-common:1.9.0'

    // PLAY ASSET DELIVERY, SOLO EN RELEASE -tarea 84, D2, 29-09-2026-. Es la biblioteca de Google
    // que pide a Play el paquete del modelo inglés -on-demand- y dice dónde quedó. Va como
    // releaseImplementation, con su clase en src/release/java/.../PaqueteDeVoz.java: la APK de
    // prueba -debug- no la lleva, trae los dos modelos dentro y usa la versión de
    // src/debug/java, que no pide nada a nadie. Es la única dependencia nueva, y la permite el
    // encargo -"en Android se permiten SOLO las de Google para Play"-.
    releaseImplementation 'com.google.android.play:asset-delivery:2.3.0'

    // CONTROL POR GESTOS -tarea 88, 04-10-2026, aprobada por Javier para esta tarea-. MediaPipe Tasks
    // Vision, de Google, Apache 2.0: reconoce la palma y la V en un cuadro de la vista previa
    // -GestosPlugin.java-. La 1.0.0 es la última estable -julio de 2026- y sus .so vienen alineados a
    // 16 KB, como pide Play: todos los LOAD de libmediapipe_tasks_jni.so -tasks-core-1.0.0.aar- con
    // alineación 0x4000, mirado con readelf. Trae tasks-core 1.0.0 -con protobuf-javalite, flogger y
    // guava-. El modelo -gesture_recognizer.task, float16, de Google- va en src/main/assets.
    // -tarea 104- Sigue en git en src/main/assets, pero en la versión de Play viaja en el paquete a
    // pedido ':gestos' -android/gestos- y sale del paquete base. La APK de prueba lo trae dentro.
    //
    // LA LICENCIA DEL MODELO -2026-10-04, tarea 88, segunda vuelta-: SIN VERIFICAR. La ficha oficial,
    // https://ai.google.dev/edge/mediapipe/solutions/vision/gesture_recognizer, enlaza el modelo
    // -storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/
    // gesture_recognizer.task- y su model card -https://storage.googleapis.com/mediapipe-assets/
    // gesture_recognizer/model_card_hand_gesture_classification_with_faireness_2022.pdf-. La model card
    // -6 páginas: arquitectura, usos, límites, ética y equidad- NO dice ninguna licencia. La página solo
    // dice, al pie, "the content of this page is licensed under the Creative Commons Attribution 4.0
    // License, and code samples are licensed under the Apache 2.0 License": eso es el texto de la página
    // y sus ejemplos, no el modelo. La model card remite para la parte de la mano a
    // google.github.io/mediapipe/solutions/models.html#hands, que hoy da 404.
    //
    // LA LICENCIA DEL MODELO, VERIFICADA -2026-10-07, Claude-. El .task trae cuatro piezas. Ninguna
    // lleva la licencia escrita adentro -buscado en los .tflite-:
    //  - hand_landmarks_detector.tflite, 5,5 MB: IDENTICO por sha256 al del hand_landmarker.task que
    //    Google publica en ai.google.dev/edge/mediapipe/solutions/vision/hand_landmarker. Su model card
    //    -"Model Card Hand Tracking (Lite_Full) with Fairness Oct 2021", pagina 2- dice "LICENSED UNDER
    //    Apache License, Version 2.0". Confirmado.
    //  - hand_detector.tflite, 2,3 MB: misma familia y misma model card, pero NO identico al que se
    //    publica hoy -otra compilacion-. Apache 2.0 casi seguro.
    //  - gesture_embedder.tflite + canned_gesture_classifier.tflite, 0,55 MB: su model card -la de 2022,
    //    arriba- no dice licencia. Solo un tercero, Qualcomm AI Hub, declara el modelo entero Apache 2.0.
    // Riesgo bajo: Google lo publica para este uso dentro de un SDK Apache 2.0. La model card de la
    // mano excluye vigilancia e identificacion de personas; Sigo no hace ninguna de las dos.
    // Apache 2.0 pide entregar el texto de la licencia con la app: pantalla de licencias -tarea 100-.
    //
    // LAS ESTADÍSTICAS A GOOGLE -2026-10-04, tarea 88, segunda vuelta-. Javier decidió bloquearlas
    // excluyendo transport-backend-cct de esta dependencia. NO SE APLICÓ, porque no calza -mirado aquí,
    // sin teléfono-:
    //   1. tasks-core 1.0.0 trae datatransport -transport-api 3.0.0, transport-runtime 3.1.0 y
    //      transport-backend-cct 3.1.0- y manda estadísticas de uso de cada tarea -RemoteLoggingClient,
    //      fuente "COREML_ON_DEVICE_SOLUTIONS"-.
    //   2. En el bytecode de tasks-core-1.0.0.aar, TaskRunner.create llama a TasksStatsLoggerFactory.create
    //      -> TasksStatsProtoLogger.create -> new RemoteLoggingClient(context), que lee
    //      CCTDestination.INSTANCE -una clase de transport-backend-cct-. Ninguno de los tres tiene try/catch
    //      ni carga perezosa: sin esa clase el reconocedor no arranca -NoClassDefFoundError-.
    //   3. capgo/camera-preview trae ML Kit -play-services-mlkit-barcode-scanning 18.3.1-, que también
    //      depende de transport-backend-cct. Con la exclusión solo aquí, la clase y el backend siguen: en el
    //      manifiesto combinado -processDebugMainManifest y processReleaseMainManifest- sigue
    //      "backend:com.google.android.datatransport.cct.CctBackendFactory" -valor "cct"- dentro de
    //      TransportBackendDiscovery, igual que antes de la tarea 88. Y transport-backend-cct BAJA de 3.1.0
    //      a 2.3.3, la de ML Kit, junto a transport-runtime 3.1.0: una mezcla que antes no estaba.
    // Así, la exclusión no bloquea nada y agrega un riesgo. Lo que quedaría -decide Javier-: sacar el
    // registro del backend del manifiesto -tools:node="remove" sobre ese meta-data-, que deja las clases
    // y bloquea también lo de ML Kit, o excluirlo en toda la app, que tumba el reconocedor -punto 2-.
    // GestosPlugin.anotarDatatransport deja "Sigo88 gestos datatransport claseCct=... backendCct=...".
    // Lo que se probó y no queda:
    //   implementation('com.google.mediapipe:tasks-vision:1.0.0') {
    //       exclude group: 'com.google.android.datatransport', module: 'transport-backend-cct'
    //   }
    // -2026-10-04, decisión de Javier- Se eligió lo primero: el registro del backend "cct" sale del
    // manifiesto con tools:node="remove" -src/main/AndroidManifest.xml, junto a
    // TransportBackendDiscovery-. Aquí no hay exclusión y las versiones de transport-* quedan como estaban.
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'

    // ENTRAR CON GOOGLE -orden A «Entrar con Google», 20-10-2026-. Credential Manager y el botón
    // «Continuar con Google» -CuentaGooglePlugin.java-, la forma que recomienda Google:
    // https://developer.android.com/identity/sign-in/credential-manager-siwg-implementation
    // Esa página muestra 1.7.0-alpha03 de credentials y "<latest version>" de googleid; la última
    // ESTABLE es 1.6.0 -developer.android.com/jetpack/androidx/releases/credentials, 08-04-2026- y la de
    // googleid, 1.2.1 -maven.google.com-. credentials-play-services-auth es la parte que usa Play
    // Services en Android 13 o anterior, y googleid trae GetSignInWithGoogleOption y el token. Sin SDK
    // nativo de Firebase: la sesión la abre la parte web -firebase/auth, src/lib/cuenta.ts-.
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
