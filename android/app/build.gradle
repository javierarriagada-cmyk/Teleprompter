apply plugin: 'com.android.application'

// La cantidad de commits del repositorio. Si git no esta -una copia sin historia- vale 1 y la
// construccion sigue: el numero nunca hace fallar el APK.
def numeroDeVersion() {
    try {
        def p = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir.parentFile)
        def salida = p.text.trim()
        p.waitFor()
        return p.exitValue() == 0 ? salida.toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}

// LA LLAVE DE SUBIDA A GOOGLE PLAY -tarea 84, A1, 29-09-2026-.
//
// NINGUNA CONTRASEÑA NI LLAVE ENTRA AL REPOSITORIO. La llave la crea Javier en su computador y
// sus datos van en android/keystore.properties -storeFile, storePassword, keyAlias, keyPassword-,
// que .gitignore deja fuera. El molde sin datos es android/keystore.properties.ejemplo.
//
// Si el archivo no está, la construcción de release igual funciona, sin firmar, y lo avisa: así el
// repositorio compila en cualquier máquina -la de un probador, la del bot-. La APK de prueba
// -assembleDebug, npm run apk- no mira nada de esto: sigue firmada con la llave de depuración.
def archivoLlaveSubida = rootProject.file('keystore.properties')
def llaveSubida = new Properties()
if (archivoLlaveSubida.exists()) {
    archivoLlaveSubida.withInputStream { llaveSubida.load(it) }
}
def hayLlaveSubida = archivoLlaveSubida.exists()

// LA VERSIÓN DE PLAY VA POR OTRO CAMINO -tarea 84-. npm run play -scripts/play.mjs- construye con
// -PparaPlay: solo entonces los modelos de voz salen del paquete base y viajan en sus paquetes de
// recursos -model-es, model-en, parte D-. Sin la propiedad -npm run apk, la APK de prueba- todo
// queda exactamente como antes: los dos modelos dentro, en assets.
def paraPlay = project.hasProperty('paraPlay')

android {
    // EL IDENTIFICADOR DE LA APP -24-09-2026-. Era com.teleprompter.app, generico, y en Google Play
    // ya lo usa otra aplicacion: no se podia publicar con el. Es el unico dato que no se puede
    // cambiar nunca despues de subir la primera version. Va con el dominio sigoteleprompter.com,
    // que Javier inscribe. Cambiarlo hace que el telefono la trate como una app nueva.
    namespace = "com.sigoteleprompter.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sigoteleprompter.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // EL NUMERO DE VERSION SUBE SOLO -28-09-2026-. Era versionCode 1 fijo: todas las APK salian
        // "1.0 (1)", la traductora vio en App Tester el mismo numero que ya tenia instalado y no habia
        // forma de saber si la version nueva era la nueva. Play ademas rechaza una subida que no
        // aumente este numero. Ahora es la cantidad de commits de main: cada APK construida despues de
        // un commit lleva un numero mayor, sin que nadie tenga que acordarse de cambiarlo.
        versionCode numeroDeVersion()
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // SOLO LOS PROCESADORES DE LOS TELEFONOS -24-09-2026-. Las bibliotecas nativas -Vosk,
        // la camara- venian para seis arquitecturas, y las x86 son solo de emuladores: 21 MB
        // del APK de 99 que ningun telefono usa. Quedan arm64-v8a -todos los telefonos de los
        // ultimos anos, el de Javier incluido- y armeabi-v7a, los de 32 bits mas viejos. Para
        // correr en el emulador del PC: ./gradlew assembleDebug -PconEmulador
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
            if (project.hasProperty('conEmulador')) abiFilters 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Solo se declara si hay llave: un signingConfig con storeFile vacío hace fallar la
        // construcción, y el encargo pide que sin el archivo igual compile.
        if (hayLlaveSubida) {
            subida {
                storeFile rootProject.file(llaveSubida['storeFile'])
                storePassword llaveSubida['storePassword']
                keyAlias llaveSubida['keyAlias']
                keyPassword llaveSubida['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hayLlaveSubida) {
                signingConfig signingConfigs.subida
            } else {
                logger.warn('AVISO -tarea 84-: no está android/keystore.properties. El paquete de release sale SIN FIRMAR y Google Play no lo acepta. Ver android/keystore.properties.ejemplo.')
            }
            // R8 -tarea 84, parte C, 29-09-2026-: encoge y ofusca el código y saca los recursos que
            // nadie usa. Las reglas de lo que no se puede tocar -lo que Capacitor y JNA buscan por
            // nombre- están en proguard-rules.pro, cada una con su por qué. Era minifyEnabled false.
            //
            // LA BANDERA PARA APAGARLO -C3-: si R8 rompe algo que solo se ve en el teléfono,
            // ./gradlew bundleRelease -PsinR8 -o npm run play -- sinR8- arma igual que antes, sin
            // encoger, mientras se encuentra la regla que falta. La APK de prueba es debug y R8 no
            // la toca nunca.
            def conR8 = !project.hasProperty('sinR8')
            minifyEnabled conR8
            shrinkResources conR8
            // Era 'proguard-android.txt', que trae -dontoptimize: pensado para cuando R8 estaba
            // apagado. Con R8 encendido va la de optimizar, la que recomienda la documentación de
            // Android -y la única que sigue existiendo desde AGP 9-.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // LOS MODELOS DE VOZ EN SUS PAQUETES DE RECURSOS, SOLO PARA PLAY -tarea 84, parte D-.
    //
    // Hoy cada persona descarga los dos modelos -126 MB- aunque lea en un solo idioma. En el AAB de
    // Play van aparte: model-es instalado con la app -install-time, el mercado principal- y model-en
    // bajado la primera vez que se lee en inglés -on-demand-. Ver android/model-es/build.gradle.
    //
    // Para eso las carpetas model-es y model-en tienen que salir de los assets del paquete base:
    // '<dir>model-es' saca la carpeta de assets con ese nombre -la del modelo y la del uuid de
    // genUUID-. El patrón es el de siempre -el que ya estaba en aaptOptions- más esas dos. Sin
    // -PparaPlay no se toca nada: la APK de prueba sigue con los dos modelos dentro -D4-.
    if (paraPlay) {
        assetPacks = [':model-es', ':model-en']
        androidResources {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>model-es:<dir>model-en'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }

    // EL MODELO DE GESTOS SIN COMPRIMIR -tarea 88, 04-10-2026-. MediaPipe abre gesture_recognizer.task
    // directo desde los assets -BaseOptions.setModelAssetPath- y para eso el archivo tiene que ir sin
    // comprimir en el paquete. Va en las dos construcciones, la de prueba y la de Play.
    androidResources {
        noCompress 'task'
    }
}

// EL uuid DEL MODELO. ESTO NO ES OPCIONAL Y NO SE ADIVINA.
//
// StorageService.unpack copia el modelo desde los assets a la memoria interna del
// telefono la primera vez, y despues compara este uuid para saber si tiene que
// volver a copiarlo. Sin el archivo, o no copia nunca o copia en cada arranque.
//
// Esta sacado del ejemplo oficial de Vosk para Android -alphacep/vosk-android-demo,
// modulo models-, que es el unico lugar donde esta escrito. No aparece en la
// documentacion.
//
// Un uuid por modelo -27-09-2026, se suma el ingles, docs/ingles.txt D3-: cada carpeta de
// assets -model-es, model-en- lleva el suyo, y VoskNativoPlugin desempaqueta cada idioma en
// su propia carpeta.
//
// LA MARCA SALE DEL CONTENIDO DEL MODELO, NO AL AZAR -28-09-2026-. Era UUID.randomUUID() en cada
// construccion: cada APK nueva traia otra marca y el telefono volvia a copiar el modelo entero
// -decenas de MB- en la primera lectura despues de CADA actualizacion, no solo al instalar. Esa
// lectura partia tarde -3,3 s en el Redmi de la traductora con la 1.0 (439)-. Ahora la marca es
// la huella de los archivos del modelo: cambia solo si cambia el modelo, y se copia una vez.
tasks.register('genUUID') {
    def carpetas = ['model-es', 'model-en']
    def ofiles = carpetas.collect { file("$buildDir/generated/assets/$it/uuid") }
    outputs.files(ofiles)
    outputs.upToDateWhen { false }
    doLast {
        carpetas.eachWithIndex { carpeta, i ->
            def raiz = file("src/main/assets/$carpeta")
            def huella = java.security.MessageDigest.getInstance('SHA-256')
            if (raiz.exists()) {
                def archivos = []
                raiz.eachFileRecurse(groovy.io.FileType.FILES) { archivos << it }
                archivos.sort { it.path }.each { a ->
                    huella.update(raiz.toPath().relativize(a.toPath()).toString().replace('\\', '/').getBytes('UTF-8'))
                    a.withInputStream { entrada ->
                        byte[] buf = new byte[1 << 16]
                        int n
                        while ((n = entrada.read(buf)) > 0) huella.update(buf, 0, n)
                    }
                }
            }
            def f = ofiles[i]
            mkdir f.parentFile
            f.text = huella.digest().encodeHex().toString()
        }
    }
}

preBuild.dependsOn(genUUID)

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // CameraX View for CamaraNativaPlugin
    implementation "androidx.camera:camera-view:1.6.2"

    // VOSK NATIVO. La biblioteca oficial, de los mismos autores de Vosk, Apache 2.0.
    //
    // Es lo que reemplaza a Vosk WASM en Android. La version web baja 34 MB por
    // internet CADA VEZ que se aprieta Leer -comprobado el 14 de septiembre de 2026
    // poniendo el telefono en modo avion: no arranca- y despues tarda en armar el
    // modelo adentro del navegador. Aca el modelo viaja en el APK y la biblioteca
    // es codigo compilado: no se baja nada y no se arma nada en tiempo de ejecucion.
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // SUBTITULOS QUEMADOS AL GUARDAR -24-09-2026-. Media3 Transformer, de Google:
    // vuelve a codificar la toma con el codificador de hardware y dibuja el
    // subtitulo en cada cuadro -CapaDeSubtitulos.java-. La 1.9.0 es la que la
    // camara ya trae -media3-common, -container y -muxer-: una sola version.
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
    implementation 'androidx.media3:media3-common:1.9.0'

    // PLAY ASSET DELIVERY, SOLO EN RELEASE -tarea 84, D2, 29-09-2026-. Es la biblioteca de Google
    // que pide a Play el paquete del modelo inglés -on-demand- y dice dónde quedó. Va como
    // releaseImplementation, con su clase en src/release/java/.../PaqueteDeVoz.java: la APK de
    // prueba -debug- no la lleva, trae los dos modelos dentro y usa la versión de
    // src/debug/java, que no pide nada a nadie. Es la única dependencia nueva, y la permite el
    // encargo -"en Android se permiten SOLO las de Google para Play"-.
    releaseImplementation 'com.google.android.play:asset-delivery:2.3.0'

    // CONTROL POR GESTOS -tarea 88, 04-10-2026, aprobada por Javier para esta tarea-. MediaPipe Tasks
    // Vision, de Google, Apache 2.0: reconoce la palma y la V en un cuadro de la vista previa
    // -GestosPlugin.java-. La 1.0.0 es la última estable -julio de 2026- y sus .so vienen alineados a
    // 16 KB, como pide Play: todos los LOAD de libmediapipe_tasks_jni.so -tasks-core-1.0.0.aar- con
    // alineación 0x4000, mirado con readelf. Trae tasks-core 1.0.0 -con protobuf-javalite, flogger y
    // guava-. El modelo -gesture_recognizer.task, float16, de Google- va en src/main/assets.
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
