# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Play lo pidió al revisar la 792, cuyo r8.json dice "isOptimizedShrinkingEnabled":false.
# Es la reducción de recursos que AGP 8.12 y 8.13 traen apagada y que AGP 9 enciende sola
# -developer.android.com/topic/performance/app-optimization/enable-app-optimization-.
# -borde-a-borde, 03-11-2026-.
android.r8.optimizedResourceShrinking=true

# R8 SIN EL MODO ESTRICTO DE LAS REGLAS, TODAVÍA -12-11-2026-. La 1.1 (808) se cerraba al abrir en todos
# los teléfonos -Test Lab: realme RMX3231 con Android 11 y Galaxy S25 con Android 16- con «Failed to create
# an instance of class androidx.work.impl.WorkDatabase.canonicalName». R8 le había quitado el constructor
# vacío a androidx.work.impl.WorkDatabase_Impl -usage.txt de la 808-, y Room la crea por reflexión. El
# plugin 9.0 pone esta propiedad en true: «-keep class A no longer implies -keep class A { <init>(); }»
# -developer.android.com/build/releases/agp-9-0-0-release-notes-. La 808 traía 21 reglas -keep así, sin
# miembros, de WorkManager, Room, Firebase, Play Services y otras, y varias son de clases que se crean por
# reflexión. En false vuelve el comportamiento de la 8.13 para todas, sin bajar R8 de la 9.5.29, que trae
# la corrección del cierre de Android 11 -a5acccb-. Se puede sacar cuando cada una de esas reglas diga su
# { <init>(); }. La de Room ya lo dice en proguard-rules.pro.
android.r8.strictFullModeForKeepRules=false
