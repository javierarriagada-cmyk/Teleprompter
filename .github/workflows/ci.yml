name: CI
on:
  push:
    branches:
      - main
      - feature/asr-improvements-5251236722100455238
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
